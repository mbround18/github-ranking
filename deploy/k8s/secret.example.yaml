# Template only — do NOT commit real credentials.
#
# Create it out of band instead:
#   kubectl -n github-ranked create secret generic github-ranked-secrets \
#     --from-literal=GITHUB_APP_ID=... \
#     --from-file=GITHUB_APP_PRIVATE_KEY=./app-private-key.pem
#
# A stock image refuses to start from a personal access token when
# APP_ENV=production, so these must be GitHub App credentials. For a
# single-tenant instance built with the `pat-in-production` feature, supply
# GITHUB_TOKEN here instead.
apiVersion: v1
kind: Secret
metadata:
  name: github-ranked-secrets
  namespace: github-ranked
type: Opaque
stringData:
  GITHUB_APP_ID: "replace-me"
  GITHUB_APP_PRIVATE_KEY: "replace-me"
