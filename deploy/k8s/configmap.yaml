apiVersion: v1
kind: ConfigMap
metadata:
  name: github-ranked-config
  namespace: github-ranked
data:
  APP_ENV: "production"
  # 10090, not 10080: Chrome and Firefox refuse to connect to 10080 (ERR_UNSAFE_PORT) because it is on their restricted-ports list. It is the only blocked port in the 10k range.
  PORT: "10090"
  WEB_ROOT: "/app/web"
  CACHE_PATH: "/data/cache.db"
  CACHE_MAX_ENTRIES: "50000"
  # Comfortably under terminationGracePeriodSeconds so a rollout can drain.
  REQUEST_TIMEOUT_SECS: "20"
  MAX_CONCURRENT_REQUESTS: "256"
  RUST_LOG: "info,github_ranked=info,tower_http=warn"
