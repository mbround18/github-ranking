# Release, built on paws (https://github.com/mbround18/paws).
#
# Version is computed from the merged PR's labels (major/minor/patch), tagged,
# released, and the container image published to match. Nothing here runs on a
# pull request — CI does that.
name: release

on:
  push:
    branches: [main]
  # Cut a release without a labelled merge, e.g. for a docs-only fix.
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # semver infers from history, so a shallow clone would mislead it.
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}

      # Labels on the PR that produced this commit decide the bump; the manual
      # path passes an explicit increment instead.
      - name: compute and push the version
        id: semver
        run: |
          if [ -n "${{ inputs.increment }}" ]; then
            version="$(paws semver --increment "${{ inputs.increment }}" --push | tail -n1)"
          else
            version="$(paws semver --labels "${{ join(github.event.head_commit.labels, ',') }}" --push | tail -n1)"
          fi

          if [ -z "$version" ]; then
            echo "::error::paws semver produced no version"
            exit 1
          fi

          echo "computed $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  image:
    name: publish image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}

      # The stock image: production authentication requires a GitHub App. A
      # single-tenant instance builds its own with
      # --build-arg CARGO_FEATURES=pat-in-production.
      #
      # paws targets docker.io unless --registries names another, even when
      # --image is fully qualified, and it reads the GHCR password from
      # $GHCR_TOKEN rather than $GITHUB_TOKEN. Without both it skips the
      # publish and still reports success.
      - name: build and push
        run: |
          paws docker \
            --image ${{ github.repository }} \
            --registries ghcr.io \
            --ghcr-username ${{ github.actor }} \
            --version "${{ needs.version.outputs.version }}" \
            --push --with-latest --tag-rollup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          # --with-latest and --tag-rollup only fire when the ref is a real
          # version tag, and this job runs on a branch push. The tag semver
          # created moments earlier is the ref this build actually represents,
          # so present it as such.
          #
          # GITHUB_REF is the one that matters — verified by running paws
          # locally across both: refs/heads/main computes one tag, and
          # refs/tags/v0.0.1 computes four (version, latest, 0.0, 0).
          GITHUB_REF: refs/tags/${{ needs.version.outputs.version }}
          GITHUB_REF_NAME: ${{ needs.version.outputs.version }}

  changelog:
    name: changelog
    needs: version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}

      - run: paws changelog --version "${{ needs.version.outputs.version }}" --commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
