# Release, built on paws (https://github.com/mbround18/paws).
#
# Version is computed from the merged PR's labels (major/minor/patch), tagged,
# released, and the container image published to match. Nothing here runs on a
# pull request — CI does that.
name: release

on:
  push:
    branches: [main]
  # Cut a release without a labelled merge, e.g. for a docs-only fix.
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # semver infers from history, so a shallow clone would mislead it.
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}

      # Labels on the PR that produced this commit decide the bump; the manual
      # path passes an explicit increment instead.
      - name: compute and push the version
        id: semver
        run: |
          if [ -n "${{ inputs.increment }}" ]; then
            version="$(paws semver --increment "${{ inputs.increment }}" --push | tail -n1)"
          else
            version="$(paws semver --labels "${{ join(github.event.head_commit.labels, ',') }}" --push | tail -n1)"
          fi

          if [ -z "$version" ]; then
            echo "::error::paws semver produced no version"
            exit 1
          fi

          echo "computed $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  image:
    name: publish image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}

      # The stock image: production authentication requires a GitHub App. A
      # single-tenant instance builds its own with
      # --build-arg CARGO_FEATURES=pat-in-production.
      #
      # paws targets docker.io unless --registries names another, even when
      # --image is fully qualified, and it reads the GHCR password from
      # $GHCR_TOKEN rather than $GITHUB_TOKEN. Without both it skips the
      # publish and still reports success.
      - name: build and push
        run: |
          paws docker \
            --image ${{ github.repository }} \
            --registries ghcr.io \
            --ghcr-username ${{ github.actor }} \
            --version "${{ needs.version.outputs.version }}" \
            --push --with-latest --tag-rollup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}

      # paws gates --with-latest and --tag-rollup on GITHUB_REF naming a version
      # tag, and this job runs on a branch push. Overriding GITHUB_REF is not an
      # option — Actions re-injects the default GITHUB_* variables, so the step
      # declares one value and the process sees another (verified: locally that
      # env computes four tags, in CI it still computed one).
      #
      # So alias them from the manifest paws just published instead. This moves
      # no bytes: imagetools points new tags at the existing digest rather than
      # rebuilding or re-uploading.
      - name: alias :latest and the rollup tags
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"

          # A prerelease must never become :latest.
          if [[ "$version" == *-* ]]; then
            echo "$version is a prerelease; leaving :latest alone"
            exit 0
          fi

          bare="${version#v}"
          major="${bare%%.*}"
          minor="${bare%.*}"

          echo "${{ github.token }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker buildx imagetools create \
            --tag "$image:latest" \
            --tag "$image:$bare" \
            --tag "$image:$minor" \
            --tag "$image:$major" \
            "$image:$version"

          echo "aliased $version -> latest, $bare, $minor, $major"

  changelog:
    name: changelog
    needs: version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: mbround18/paws/actions/paws-up@main
        with:
          github-token: ${{ github.token }}

      - run: paws changelog --version "${{ needs.version.outputs.version }}" --commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
