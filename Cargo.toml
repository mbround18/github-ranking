[workspace]
resolver = "3"
members = ["crates/auth-core", "crates/auth-pat", "crates/core", "tools/fontgen"]
exclude = ["tools/preview"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
github-ranked-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
