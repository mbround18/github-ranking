[workspace]
resolver = "3"
members = ["crates/auth-core", "crates/auth-pat", "crates/core", "crates/server", "crates/wasm", "tools/fontgen"]
exclude = ["tools/preview"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
github-ranked-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast wasm. The frontend ships this on every page load.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release.package.github-ranked-wasm]
opt-level = "z"
